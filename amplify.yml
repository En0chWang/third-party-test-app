version: 1
backend:
  phases:
    preBuild:
      commands:
        - ls -al .
    build:
      commands:
        - ls -al .
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - ls -al ./local-packages  # Confirm the .tgz file exists
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*